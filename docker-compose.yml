services:
  redis:
    image: redis:7-alpine
    container_name: similepro_redis
    networks:
      - similepro_shared
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: similepro_backend
    env_file:
      - .env
    environment:
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?configure ENCRYPTION_KEY in backend .env}"
      ENV: development
      REDIS_ADDR: similepro_redis:6379
    volumes:
    - ./.env:/app/.env
    depends_on:
      - redis
      - postgres_db # Garante que o Go só liga DEPOIS que o Postgres estiver pronto
    networks:
      - similepro_shared
    restart: always

  cloudflare_tunnel:
    image: cloudflare/cloudflared:latest
    container_name: similepro_tunnel
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?configure CLOUDFLARE_TUNNEL_TOKEN in the backend .env file}
    command: tunnel run
    networks:
      - similepro_shared

  postgres_db:
    image: postgres:15-alpine
    container_name: similepro_postgres
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?configure DB_PASSWORD in backend .env}"
      POSTGRES_DB: "${DB_NAME:?configure DB_NAME in backend .env}"
    ports:
      - "5432:5432" # Expõe para você conseguir olhar o banco pelo DBeaver/PgAdmin se quiser
    volumes:
      - postgres_data:/var/lib/postgresql/data # <--- ISSO GARANTE QUE OS DADOS NÃO SUMAM
    networks:
      - similepro_shared
    restart: always

volumes:
  postgres_data:
    driver: local

networks:
  similepro_shared:
    name: similepro_global_net
    external: true
